services:
  - type: web
    name: discord-bot
    env: node
    buildCommand: npm install
    startCommand: npx pm2-runtime ecosystem.config.js
    envVars:
      - key: NODE_ENV
        value: production
    disks:
      - name: bot-data
        mountPath: /opt/render/project/src/data
        sizeGB: 1
